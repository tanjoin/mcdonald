<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マクドナルド 栄養成分カレンダー登録</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">マクドナルド 栄養成分カレンダー登録</h1>
                    <p class="text-sm text-gray-500 mt-1">メニューを検索して、食べた時間をカレンダーに記録しよう</p>
                </div>
                <div class="relative w-full md:w-96">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                    <input type="text" id="searchInput" placeholder="メニュー名や説明で検索..." class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg leading-5 bg-gray-50 placeholder-gray-500 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-150 ease-in-out">
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div class="flex flex-col sm:flex-row gap-4 sm:items-center sm:justify-between">
                <div id="statusMessage" class="text-sm text-gray-600"></div>

                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <label for="sortSelect" class="text-sm font-medium text-gray-700 whitespace-nowrap">並び替え:</label>
                    <select id="sortSelect" class="block w-full sm:w-auto pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md bg-gray-50">
                        <option value="name_asc">名前 (昇順)</option>
                        <option value="name_desc">名前 (降順)</option>
                        <option value="price_asc">価格 (安い順)</option>
                        <option value="price_desc">価格 (高い順)</option>
                        <option value="energy_asc">エネルギー (低い順)</option>
                        <option value="energy_desc">エネルギー (高い順)</option>
                        <option value="protein_desc">たんぱく質 (多い順)</option>
                        <option value="protein_asc">たんぱく質 (少ない順)</option>
                        <option value="fat_asc">脂質 (少ない順)</option>
                        <option value="fat_desc">脂質 (多い順)</option>
                        <option value="carbo_asc">炭水化物 (少ない順)</option>
                        <option value="carbo_desc">炭水化物 (多い順)</option>
                        <option value="salt_asc">食塩相当量 (少ない順)</option>
                        <option value="salt_desc">食塩相当量 (多い順)</option>
                    </select>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-gray-100">
                <div class="flex items-center gap-2 flex-wrap">
                    <button type="button" id="toggleAllUnknownButton" class="px-3 py-2 rounded-full text-xs font-semibold border transition-colors duration-150"></button>
                    <button type="button" id="toggleUnknownDetailButton" class="px-3 py-2 rounded-full text-xs font-semibold border border-gray-300 text-gray-700 bg-white hover:bg-gray-50 transition-colors duration-150" aria-expanded="false" aria-controls="unknownFilterButtons">詳細を開く</button>
                </div>

                <div class="hidden mt-2 flex items-center flex-wrap gap-2" id="unknownFilterButtons" aria-label="フィルター詳細">
                    <button type="button" class="unknown-filter-btn px-3 py-2 rounded-full text-xs font-semibold border transition-colors duration-150" data-nutrient="energy" data-label="エネルギー">エネルギー: 除外中</button>
                    <button type="button" class="unknown-filter-btn px-3 py-2 rounded-full text-xs font-semibold border transition-colors duration-150" data-nutrient="protein" data-label="たんぱく質">たんぱく質: 除外中</button>
                    <button type="button" class="unknown-filter-btn px-3 py-2 rounded-full text-xs font-semibold border transition-colors duration-150" data-nutrient="fat" data-label="脂質">脂質: 除外中</button>
                    <button type="button" class="unknown-filter-btn px-3 py-2 rounded-full text-xs font-semibold border transition-colors duration-150" data-nutrient="carbo" data-label="炭水化物">炭水化物: 除外中</button>
                    <button type="button" class="unknown-filter-btn px-3 py-2 rounded-full text-xs font-semibold border transition-colors duration-150" data-nutrient="salt" data-label="食塩">食塩: 除外中</button>
                </div>
            </div>
        </div>
        
        <!-- メニューグリッド -->
        <div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JavaScriptで動的にカードが生成されます -->
        </div>
        
        <!-- データがない場合の表示 -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-12 text-center">
            <svg class="h-16 w-16 text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h3 class="text-lg font-medium text-gray-900">見つかりませんでした</h3>
            <p class="mt-1 text-sm text-gray-500">別のキーワードで検索をお試しください。</p>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 text-center text-sm text-gray-500">
            <a href="https://github.com/tanjoin/mcdonald" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
    </footer>

    <script>
        let allMenuItems = [];
        let filteredItems = [];
        let currentSort = 'energy_desc';
        let searchQuery = '';

        const nutrientConfig = {
            energy: 'エネルギー',
            protein: 'たんぱく質',
            fat: '脂質',
            carbo: '炭水化物',
            salt: '食塩相当量'
        };

        const unknownFilterState = {
            energy: false,
            protein: false,
            fat: false,
            carbo: false,
            salt: false
        };

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const menuGrid = document.getElementById('menuGrid');
        const emptyState = document.getElementById('emptyState');
        const statusMessage = document.getElementById('statusMessage');
        const toggleAllUnknownButton = document.getElementById('toggleAllUnknownButton');
        const toggleUnknownDetailButton = document.getElementById('toggleUnknownDetailButton');
        const unknownFilterButtonsContainer = document.getElementById('unknownFilterButtons');
        const unknownFilterButtons = document.querySelectorAll('.unknown-filter-btn');

        async function loadData() {
            try {
                // 同じディレクトリのmenu_data.jsonを取得
                const response = await fetch('menu_data.json');
                if (response.ok) {
                    allMenuItems = await response.json();
                    statusMessage.textContent = `${allMenuItems.length}件のデータを読み込みました。`;
                } else {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
            } catch (error) {
                console.error('menu_data.jsonの読み込みに失敗しました。', error);
                statusMessage.textContent = "データの読み込みに失敗しました。";
                statusMessage.classList.add("text-red-500");
                return; // データ読み込み失敗時はここで終了
            }
            
            // UI初期化
            sortSelect.value = currentSort;
            updateUnknownFilterButtonStyles();
            updateUnknownMasterButtonStyle();
            applyFiltersAndSort();
        }

        // 栄養素配列から特定のキーの値（数値）を取り出す関数（ソート用）
        function getNutrientNumber(nutArray, keyName) {
            if (!nutArray || !Array.isArray(nutArray)) return 0;
            const target = nutArray.find(item => item.startsWith(keyName));
            if (target) {
                // 文字列から数値部分のみを抽出 (例: "192kcal" -> 192, "0.4g" -> 0.4)
                const numStr = target.replace(keyName, '').replace(/[^0-9.]/g, '').trim();
                const num = parseFloat(numStr);
                return isNaN(num) ? 0 : num;
            }
            return 0;
        }

        // 栄養素配列から特定のキーの値（文字列）を取り出す関数（表示用）
        function getNutrientString(nutArray, keyName) {
            if (!nutArray || !Array.isArray(nutArray)) return "不明";
            const target = nutArray.find(item => item.startsWith(keyName));
            if (target) {
                const value = target.replace(keyName, '').trim();
                return value || "不明";
            }
            return "不明";
        }

        function isUnknownValue(value) {
            if (value == null) return true;
            const normalized = String(value).trim();
            if (!normalized) return true;
            return /^(不明|[-ー―‐－–—]+|N\/A|n\/a|なし)$/i.test(normalized);
        }

        function sortItems() {
            const sortParts = currentSort.split('_');
            const sortBy = sortParts[0];
            const sortOrder = sortParts[1] === 'asc' ? 1 : -1;

            filteredItems.sort((a, b) => {
                let valA, valB;

                switch (sortBy) {
                    case 'name':
                        valA = a.name || "";
                        valB = b.name || "";
                        return valA.localeCompare(valB, 'ja') * sortOrder;
                    case 'price':
                        valA = parseFloat(a.price) || 0;
                        valB = parseFloat(b.price) || 0;
                        break;
                    case 'energy':
                        valA = getNutrientNumber(a.nut, 'エネルギー');
                        valB = getNutrientNumber(b.nut, 'エネルギー');
                        break;
                    case 'protein':
                        valA = getNutrientNumber(a.nut, 'たんぱく質');
                        valB = getNutrientNumber(b.nut, 'たんぱく質');
                        break;
                    case 'fat':
                        valA = getNutrientNumber(a.nut, '脂質');
                        valB = getNutrientNumber(b.nut, '脂質');
                        break;
                    case 'carbo':
                        valA = getNutrientNumber(a.nut, '炭水化物');
                        valB = getNutrientNumber(b.nut, '炭水化物');
                        break;
                    case 'salt':
                        valA = getNutrientNumber(a.nut, '食塩相当量');
                        valB = getNutrientNumber(b.nut, '食塩相当量');
                        break;
                    default:
                        return 0;
                }

                if (valA < valB) return -1 * sortOrder;
                if (valA > valB) return 1 * sortOrder;
                return 0;
            });

            renderMenuGrid();
        }

        function updateUnknownFilterButtonStyles() {
            unknownFilterButtons.forEach((button) => {
                const nutrient = button.dataset.nutrient;
                const label = button.dataset.label || nutrient;
                const enabled = unknownFilterState[nutrient];
                button.setAttribute('aria-pressed', String(enabled));
                button.textContent = `${label}: ${enabled ? '表示中' : '除外中'}`;

                if (enabled) {
                    button.classList.remove('bg-white', 'text-gray-600', 'border-gray-300');
                    button.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
                } else {
                    button.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                    button.classList.add('bg-white', 'text-gray-600', 'border-gray-300');
                }
            });
        }

        function updateUnknownMasterButtonStyle() {
            const values = Object.values(unknownFilterState);
            const allEnabled = values.every(Boolean);
            const allDisabled = values.every(v => !v);

            toggleAllUnknownButton.classList.remove(
                'bg-blue-600',
                'text-white',
                'border-blue-600',
                'bg-white',
                'text-gray-700',
                'border-gray-300',
                'bg-amber-100',
                'text-amber-800',
                'border-amber-300'
            );

            if (allEnabled) {
                toggleAllUnknownButton.textContent = '不明値: すべて表示中';
                toggleAllUnknownButton.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
            } else if (allDisabled) {
                toggleAllUnknownButton.textContent = '不明値: すべて除外中';
                toggleAllUnknownButton.classList.add('bg-white', 'text-gray-700', 'border-gray-300');
            } else {
                toggleAllUnknownButton.textContent = '不明値: 一部表示中';
                toggleAllUnknownButton.classList.add('bg-amber-100', 'text-amber-800', 'border-amber-300');
            }
        }

        function isUnknownNutrient(item, nutrientKey) {
            const value = getNutrientString(item.nut, nutrientConfig[nutrientKey]);
            return isUnknownValue(value);
        }

        function parseOrTerms(query) {
            const normalized = query.trim();
            if (!normalized) return [];

            return normalized
                .split(/\s+or\s+/i)
                .map(term => term.trim())
                .filter(Boolean);
        }

        function applyFiltersAndSort() {
            const orTerms = parseOrTerms(searchQuery);

            filteredItems = allMenuItems.filter(item => {
                const searchable = `${item.name || ''} ${item.description || ''}`.toLowerCase();
                const queryMatch = orTerms.length === 0
                    ? true
                    : orTerms.some(term => searchable.includes(term));

                if (!queryMatch) return false;

                for (const nutrientKey of Object.keys(unknownFilterState)) {
                    if (!unknownFilterState[nutrientKey] && isUnknownNutrient(item, nutrientKey)) {
                        return false;
                    }
                }

                return true;
            });

            sortItems();
        }

        function renderMenuGrid() {
            menuGrid.innerHTML = '';
            
            if (filteredItems.length === 0) {
                emptyState.classList.remove('hidden');
                menuGrid.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            menuGrid.classList.remove('hidden');

            filteredItems.forEach((item, index) => {
                const energy = getNutrientString(item.nut, 'エネルギー');
                const protein = getNutrientString(item.nut, 'たんぱく質');
                const fat = getNutrientString(item.nut, '脂質');
                const carbo = getNutrientString(item.nut, '炭水化物');
                const salt = getNutrientString(item.nut, '食塩相当量');

                // 安全なID付与のため、オリジナルデータ配列内のインデックスを特定
                const originalIndex = allMenuItems.indexOf(item);

                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow duration-200 flex flex-col h-full';
                
                card.innerHTML = `
                    <div class="p-5 flex-grow flex flex-col">
                        <div class="flex justify-between items-start mb-2">
                          <a href="${item.link}" target="_blank">
                            <h2 class="text-lg font-bold text-gray-900 leading-tight">${item.name}</h2>
                          </a>
                        </div>
                        <p class="text-xs text-gray-500 mb-3">${item.priceText || '価格未設定'}</p>
                        
                        <p class="text-sm text-gray-600 mb-4 flex-grow line-clamp-3" title="${item.description}">
                            ${item.description || ''}
                        </p>
                        
                        <div class="bg-gray-50 rounded-lg p-3 mb-4 text-xs">
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-semibold text-gray-700">エネルギー</span>
                                <span class="font-bold text-orange-600">${energy}</span>
                            </div>
                            <div class="grid grid-cols-2 gap-1 text-gray-600 mt-2">
                                <div>たんぱく質: ${protein}</div>
                                <div>脂質: ${fat}</div>
                                <div>炭水化物: ${carbo}</div>
                                <div>食塩: ${salt}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="px-5 pb-5 mt-auto">
                        <button onclick="addToCalendar(${originalIndex})" class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg font-medium transition-colors duration-200">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                            カレンダーに登録
                        </button>
                    </div>
                `;
                menuGrid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            applyFiltersAndSort();
        });

        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            sortItems();
        });

        unknownFilterButtons.forEach((button) => {
            button.addEventListener('click', () => {
                const nutrient = button.dataset.nutrient;
                unknownFilterState[nutrient] = !unknownFilterState[nutrient];
                updateUnknownFilterButtonStyles();
                updateUnknownMasterButtonStyle();
                applyFiltersAndSort();
            });
        });

        toggleAllUnknownButton.addEventListener('click', () => {
            const shouldEnable = !Object.values(unknownFilterState).every(Boolean);

            Object.keys(unknownFilterState).forEach((nutrientKey) => {
                unknownFilterState[nutrientKey] = shouldEnable;
            });

            updateUnknownFilterButtonStyles();
            updateUnknownMasterButtonStyle();
            applyFiltersAndSort();
        });

        toggleUnknownDetailButton.addEventListener('click', () => {
            const isHidden = unknownFilterButtonsContainer.classList.contains('hidden');
            unknownFilterButtonsContainer.classList.toggle('hidden', !isHidden);
            toggleUnknownDetailButton.setAttribute('aria-expanded', String(isHidden));
            toggleUnknownDetailButton.textContent = isHidden ? '詳細を閉じる' : '詳細を開く';
        });

        function addToCalendar(index) {
            const item = allMenuItems[index];
            if (!item) return;

            // 栄養素の取得 (文字列)
            const energy = getNutrientString(item.nut, 'エネルギー');
            const protein = getNutrientString(item.nut, 'たんぱく質');
            const fat = getNutrientString(item.nut, '脂質');
            const carbo = getNutrientString(item.nut, '炭水化物');
            const salt = getNutrientString(item.nut, '食塩相当量');

            // タイトルと説明文の作成（指定されたフォーマットに準拠）
            const title = `${item.name} ${energy}`;
            const details = `マクドナルド\n${item.link}\n${item.nut.filter(n => !n.includes('エネルギー')).join('\n')}`;

            // 日時の設定 (クリックした「現在時刻」を開始、30分後を終了とする)
            const now = new Date();
            const end = new Date(now.getTime());

            // Googleカレンダー用のフォーマット YYYYMMDDTHHMMSSZ (UTC)
            const formatToUTC = (date) => {
                return date.toISOString().replace(/-|:|\.\d\d\d/g, '');
            };

            const startTime = formatToUTC(now);
            const endTime = formatToUTC(end);

            // URLパラメータの構築
            const params = new URLSearchParams({
                action: 'TEMPLATE',
                text: title,
                details: details,
                dates: `${startTime}/${endTime}`
            });

            // Googleカレンダーの予定作成URL
            const calendarUrl = `https://calendar.google.com/calendar/render?${params.toString()}`;

            // 新しいタブで開く
            window.open(calendarUrl, '_blank');
        }

        updateUnknownFilterButtonStyles();
        updateUnknownMasterButtonStyle();
        sortSelect.value = currentSort;

        // アプリケーション起動
        window.onload = loadData;

    </script>
</body>
</html>
